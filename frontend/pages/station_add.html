<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Station - Metro Rail</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <nav>
    <a href="index.html">Dashboard</a> |
    <a href="passengers.html">Passengers</a> |
    <a href="cards.html">Smart Cards</a> |
    <a href="stations.html" class="active">Stations</a> |
    <a href="transactions.html">Transactions</a>
  </nav>

  <div class="container">
    <a href="stations.html" class="back-link">&larr; Back to Stations Menu</a>
    <h2>Add New Metro Station</h2>
    <div id="message-area" class="message-hidden"></div>

    <div class="form-box">
      <form id="station-add-form">
        <div class="form-group">
          <label for="station_id">Station ID *</label>
          <input type="number" id="station_id" name="station_id" placeholder="Enter ID (e.g. 101)" min="1" step="1" required>
          <div class="form-hint">Enter a unique integer for this station.</div>
        </div>

        <div class="form-group">
          <label for="station_name">Station Name *</label>
          <input type="text" id="station_name" name="station_name" placeholder="e.g. MP Nagar" required>
        </div>

        <div class="form-group">
          <label for="line_name">Line Name *</label>
          <input type="text" id="line_name" name="line_name" placeholder="e.g. Orange Line" required>
        </div>

        <button type="submit" class="btn btn-success">Add Station</button>
        <button type="reset" class="btn btn-secondary">Clear</button>
      </form>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/stations.js"></script>
</body>
</html>
