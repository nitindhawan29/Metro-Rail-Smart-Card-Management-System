<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Record Transaction - Metro Rail</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <nav>
    <a href="index.html">Dashboard</a> |
    <a href="passengers.html">Passengers</a> |
    <a href="cards.html">Smart Cards</a> |
    <a href="stations.html">Stations</a> |
    <a href="transactions.html" class="active">Transactions</a>
  </nav>

  <div class="container">
    <a href="transactions.html" class="back-link">&larr; Back to Transactions Menu</a>
    <h2>Record New Transaction</h2>
    <div id="message-area" class="message-hidden"></div>

    <div class="form-box">
      <form id="transaction-add-form">
        <div class="form-group">
          <label for="transaction_id">Transaction ID *</label>
          <input type="number" id="transaction_id" name="transaction_id" placeholder="Enter ID (e.g. 101)" min="1" step="1" required>
          <div class="form-hint">Enter a unique integer for this transaction.</div>
        </div>

        <div class="form-group">
          <label for="card_id">Smart Card *</label>
          <select id="card_id" name="card_id" required>
            <option value="">Loading smart cards...</option>
          </select>
        </div>

        <div class="form-group">
          <label for="station_id">Station *</label>
          <select id="station_id" name="station_id" required>
            <option value="">Loading stations...</option>
          </select>
        </div>

        <div class="form-group">
          <label for="fare_amount">Fare Amount (₹) *</label>
          <input type="number" id="fare_amount" name="fare_amount" min="0" step="0.01" placeholder="e.g. 25.00" required>
        </div>

        <button type="submit" class="btn btn-success">Record & Deduct Fare</button>
        <button type="reset" class="btn btn-secondary">Clear</button>
      </form>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/transactions.js"></script>
</body>
</html>
