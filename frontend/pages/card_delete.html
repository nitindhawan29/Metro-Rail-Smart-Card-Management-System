<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Delete Smart Card - Metro Rail</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <nav>
    <a href="index.html">Dashboard</a> |
    <a href="passengers.html">Passengers</a> |
    <a href="cards.html" class="active">Smart Cards</a> |
    <a href="stations.html">Stations</a> |
    <a href="transactions.html">Transactions</a>
  </nav>

  <div class="container">
    <a href="cards.html" class="back-link">&larr; Back to Smart Cards Menu</a>
    <h2>Delete Smart Card</h2>
    <p>Search and locate the smart card, then click <strong>Delete</strong>.</p>
    <div id="message-area" class="message-hidden"></div>

    <!-- Search / Filter Box -->
    <div class="filter-box">
      <div class="filter-title">🔍 Search & Filter Smart Cards</div>
      <div class="filter-grid">
        <div class="filter-field">
          <label>Card ID:</label>
          <div class="input-with-sort">
            <input type="text" id="filter-id" list="dl-id" placeholder="ID...">
            <button type="button" class="sort-btn" id="sort-id" title="Toggle Sort">⇅</button>
          </div>
          <datalist id="dl-id"></datalist>
        </div>

        <div class="filter-field">
          <label>Card Number:</label>
          <div class="input-with-sort">
            <input type="text" id="filter-number" list="dl-number" placeholder="METRO...">
            <button type="button" class="sort-btn" id="sort-number" title="Toggle Sort">⇅</button>
          </div>
          <datalist id="dl-number"></datalist>
        </div>

        <div class="filter-field">
          <label>Passenger:</label>
          <div class="input-with-sort">
            <input type="text" id="filter-passenger" list="dl-passenger" placeholder="Passenger...">
            <button type="button" class="sort-btn" id="sort-passenger" title="Toggle Sort">⇅</button>
          </div>
          <datalist id="dl-passenger"></datalist>
        </div>

        <div class="filter-field">
          <label>Balance (₹):</label>
          <div class="input-with-sort">
            <input type="text" id="filter-balance" list="dl-balance" placeholder="Balance...">
            <button type="button" class="sort-btn" id="sort-balance" title="Toggle Sort">⇅</button>
          </div>
          <datalist id="dl-balance"></datalist>
        </div>
      </div>

      <div class="filter-actions">
        <span id="record-count">Loading records...</span>
        <button type="button" class="btn btn-secondary btn-sm" id="btn-clear-filter">Reset Filters</button>
      </div>
    </div>

    <!-- Data Table with Delete Buttons -->
    <div class="table-container">
      <table id="card-delete-table">
        <thead>
          <tr>
            <th>Card ID</th>
            <th>Card Number</th>
            <th>Passenger</th>
            <th>Current Balance</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="card-delete-tbody">
          <tr><td colspan="5">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/cards.js"></script>
</body>
</html>
