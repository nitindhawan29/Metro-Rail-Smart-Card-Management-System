<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Show Passengers - Metro Rail</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <nav>
    <a href="index.html">Dashboard</a> |
    <a href="passengers.html" class="active">Passengers</a> |
    <a href="cards.html">Smart Cards</a> |
    <a href="stations.html">Stations</a> |
    <a href="transactions.html">Transactions</a>
  </nav>

  <div class="container">
    <a href="passengers.html" class="back-link">&larr; Back to Passengers Menu</a>
    <h2>All Passengers</h2>
    <div id="message-area" class="message-hidden"></div>

    <!-- Search / Filter Box -->
    <div class="filter-box">
      <div class="filter-title">🔍 Search & Filter (Leave blank for no filter)</div>
      <div class="filter-grid">
        <div class="filter-field">
          <label>Passenger ID:</label>
          <div class="input-with-sort">
            <input type="text" id="filter-id" list="dl-id" placeholder="ID...">
            <button type="button" class="sort-btn" id="sort-id" title="Toggle Sort">⇅</button>
          </div>
          <datalist id="dl-id"></datalist>
        </div>

        <div class="filter-field">
          <label>Passenger Name:</label>
          <div class="input-with-sort">
            <input type="text" id="filter-name" list="dl-name" placeholder="Name...">
            <button type="button" class="sort-btn" id="sort-name" title="Toggle Sort">⇅</button>
          </div>
          <datalist id="dl-name"></datalist>
        </div>

        <div class="filter-field">
          <label>Country Code:</label>
          <div class="input-with-sort">
            <input type="text" id="filter-country" list="dl-country" placeholder="+91...">
            <button type="button" class="sort-btn" id="sort-country" title="Toggle Sort">⇅</button>
          </div>
          <datalist id="dl-country"></datalist>
        </div>

        <div class="filter-field">
          <label>Mobile Number:</label>
          <div class="input-with-sort">
            <input type="text" id="filter-mobile" list="dl-mobile" placeholder="Mobile...">
            <button type="button" class="sort-btn" id="sort-mobile" title="Toggle Sort">⇅</button>
          </div>
          <datalist id="dl-mobile"></datalist>
        </div>

        <div class="filter-field">
          <label>Email Address:</label>
          <div class="input-with-sort">
            <input type="text" id="filter-email" list="dl-email" placeholder="Email...">
            <button type="button" class="sort-btn" id="sort-email" title="Toggle Sort">⇅</button>
          </div>
          <datalist id="dl-email"></datalist>
        </div>
      </div>

      <div class="filter-actions">
        <span id="record-count">Loading records...</span>
        <button type="button" class="btn btn-secondary btn-sm" id="btn-clear-filter">Reset Filters</button>
      </div>
    </div>

    <!-- Data Table -->
    <div class="table-container">
      <table id="passenger-show-table">
        <thead>
          <tr>
            <th>Passenger ID</th>
            <th>Name</th>
            <th>Country Code</th>
            <th>Mobile Number</th>
            <th>Email</th>
          </tr>
        </thead>
        <tbody id="passenger-show-tbody">
          <tr><td colspan="5">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/passengers.js"></script>
</body>
</html>
