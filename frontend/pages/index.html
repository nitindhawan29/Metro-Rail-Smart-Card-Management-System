<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/index.css" />
  </head>
  <body>
    <nav>
      <a href="index.html">Dashboard</a> |
      <a href="passengers.html">Passengers</a> |
      <a href="cards.html">Smart Cards</a> |
      <a href="stations.html">Stations</a> |
      <a href="transactions.html">Transactions</a>
    </nav>

    <main>
      <h1>System Dashboard</h1>
      <div id="message-area" class="message-hidden"></div>

      <section class="dashboard-cards">
        <div class="card">
          Total Passengers: <span id="total-passengers">0</span>
        </div>
        <div class="card">
          Total Smart Cards: <span id="total-cards">0</span>
        </div>
        <div class="card">
          Total Stations: <span id="total-stations">0</span>
        </div>
        <div class="card">
          Total Transactions: <span id="total-transactions">0</span>
        </div>
      </section>

      <!-- ADDED: Recent Transactions Table -->
      <section class="table-section">
        <h2>Recent Transactions</h2>
        <table id="recent-transactions-table">
          <thead>
            <tr>
              <th>Transaction ID</th>
              <th>Card Number</th>
              <th>Station</th>
              <th>Fare</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody id="recent-transactions-body">
            <tr id="empty-state">
              <td colspan="5">No records found</td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>

    <script src="../js/config.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/mockApi.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/dashboard.js"></script>
  </body>
</html>
