<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Passenger - Metro Rail</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <nav>
    <a href="index.html">Dashboard</a> |
    <a href="passengers.html" class="active">Passengers</a> |
    <a href="cards.html">Smart Cards</a> |
    <a href="stations.html">Stations</a> |
    <a href="transactions.html">Transactions</a>
  </nav>

  <div class="container">
    <a href="passengers.html" class="back-link">&larr; Back to Passengers Menu</a>
    <h2>Add New Passenger</h2>
    <div id="message-area" class="message-hidden"></div>

    <div class="form-box">
      <form id="passenger-add-form">
        <div class="form-group">
          <label for="passenger_id">Passenger ID * (User-provided Primary Key)</label>
          <input type="number" id="passenger_id" name="passenger_id" placeholder="Enter ID (e.g. 101)" min="1" step="1" required>
          <div class="form-hint">Enter a unique integer for this passenger (auto-increment surrogate key is removed).</div>
        </div>

        <div class="form-group">
          <label for="passenger_name">Passenger Name *</label>
          <input type="text" id="passenger_name" name="passenger_name" placeholder="Full Name" required>
        </div>

        <div class="form-group">
          <label for="country_code">Country Code *</label>
          <input type="text" id="country_code" name="country_code" placeholder="+91" required>
        </div>

        <div class="form-group">
          <label for="mobile_number">Mobile Number *</label>
          <input type="text" id="mobile_number" name="mobile_number" placeholder="9876543210" required>
        </div>

        <div class="form-group">
          <label for="email">Email Address (Optional)</label>
          <input type="email" id="email" name="email" placeholder="user@gmail.com">
        </div>

        <button type="submit" class="btn btn-success">Save Passenger</button>
        <button type="reset" class="btn btn-secondary">Clear</button>
      </form>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/passengers.js"></script>
</body>
</html>
